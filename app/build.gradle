plugins { id 'com.android.application' }
android {
 namespace 'app.simple'; compileSdk 35
 defaultConfig { applicationId 'app.simple'; minSdk 29; targetSdk 35; versionCode 1; versionName '0.1.0'; testInstrumentationRunner 'android.test.InstrumentationTestRunner' }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 packaging { resources.excludes += ['META-INF/DEPENDENCIES','META-INF/LICENSE*','META-INF/NOTICE*'] }
}
dependencies {
 implementation 'com.google.mlkit:text-recognition:16.0.1'
 implementation 'com.tom-roush:pdfbox-android:2.0.27.0'
 testImplementation 'junit:junit:4.13.2'
}
